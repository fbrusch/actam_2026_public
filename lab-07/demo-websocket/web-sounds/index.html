<!doctype html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<h1>Python sends control, browser makes sound</h1>
<p id="status">connecting...</p>
<button id="start" disabled>start</button>
<button id="stop" disabled>stop</button>
<p>Filter cutoff (sent back to Python): <input id="cutoff" type="range" min="0" max="1" step="0.01" value="0.5"></p>

<script>
let ctx;                    // created lazily, on the user's first click

const ws = new WebSocket("ws://localhost:8765");

const voices = new Map();   // freq -> {osc, gain, filter}
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

function cutoffToHz(norm) {
  return 200 * Math.pow(8000 / 200, norm);   // exponential: 0 -> 200 Hz, 1 -> 8000 Hz
}
let cutoffHz = cutoffToHz(parseFloat(document.getElementById("cutoff").value));

function stopAllVoices() {
  for (const { osc, gain } of voices.values()) {
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05);
    osc.stop(ctx.currentTime + 0.06);
  }
  voices.clear();
}

ws.onopen = () => {
  document.getElementById("status").textContent = "connected";
  startBtn.disabled = false;
};

ws.onclose = () => {
  document.getElementById("status").textContent = "disconnected";
  startBtn.disabled = true;
  stopBtn.disabled = true;
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "note_on") {
    const osc = ctx.createOscillator();

    const filter = ctx.createBiquadFilter();

    const gain = ctx.createGain();

    osc.type = "sawtooth";
    osc.frequency.value = msg.freq; // from the python code

    filter.type = "lowpass";
    filter.frequency.value = cutoffHz;

    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.01);  // short attack
    
    osc.connect(filter).connect(gain).connect(ctx.destination);
    osc.start();
    voices.set(msg.freq, { osc, gain, filter });
  }

  if (msg.type === "note_off") {
    const voice = voices.get(msg.freq);
    if (voice) {
      voice.gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05);  // short release
      voice.osc.stop(ctx.currentTime + 0.06);
      voices.delete(msg.freq);
    }
  }

  if (msg.type === "all_notes_off") {
    stopAllVoices();
  }
};

startBtn.onclick = () => {
  if (!ctx) ctx = new AudioContext();
  ctx.resume();                                    // required after a user gesture
  ws.send(JSON.stringify({ type: "start" }));
  startBtn.disabled = true;
  stopBtn.disabled = false;
};

stopBtn.onclick = () => {
  ws.send(JSON.stringify({ type: "stop" }));        // tells Python to stop sequencing
  stopAllVoices();                                   // and kill any notes still ringing
  startBtn.disabled = false;
  stopBtn.disabled = true;
};

// the cutoff is applied live, right here: this demo's audio lives in the
// browser, so the filter does too, and the slider controls it directly.
document.getElementById("cutoff").addEventListener("input", (e) => {
  cutoffHz = cutoffToHz(parseFloat(e.target.value));
  if (ctx) {
    for (const voice of voices.values()) {
      voice.filter.frequency.setTargetAtTime(cutoffHz, ctx.currentTime, 0.01);
    }
  }
  // also reported to Python, e.g. to be saved into a preset
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ cutoff: parseFloat(e.target.value) }));
  }
});
</script>

</body>
</html>
