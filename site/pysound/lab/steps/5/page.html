<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keys</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; margin: 1.5rem; background: #f7f5ef; color: #182f3a; line-height: 1.5; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    button { font: inherit; padding: .4rem .8rem; margin: 0 .3rem .3rem 0; border: 1px solid #087e83; background: #fff; color: #087e83; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    #state { color: #53656c; font-size: .85rem; }
    #keys { margin-top: 1rem; }
    #keys button { width: 3rem; height: 7rem; vertical-align: top; }
    #keys button:active { background: #cfe7e6; }
    .hint { color: #53656c; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Keys</h1>
  <button id="play" disabled>▶ start audio</button>
  <span id="state">loading Python…</span>
  <div id="keys"></div>
  <p class="hint">Or the keyboard: A S D F G H J K.</p>

  <script type="module" src="main.js"></script>
</body>
</html>
