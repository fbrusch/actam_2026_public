<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parts on request</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; margin: 1.5rem; background: #f7f5ef; color: #182f3a; line-height: 1.5; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    button { font: inherit; padding: .4rem .8rem; margin: 0 .3rem .3rem 0; border: 1px solid #087e83; background: #fff; color: #087e83; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    #state { color: #53656c; font-size: .85rem; }
    #log { color: #53656c; font-size: .85rem; }
    a { color: #087e83; }
    .hint { color: #53656c; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Parts on request</h1>
  <p>Each button asks the loop to change at the end of its round.</p>
  <button id="play" disabled>▶ play</button>
  <button id="stop" disabled>stop</button>
  <span id="state">loading Python…</span>
  <p class="parts">
    <button data-clip="call">call</button>
    <button data-clip="climb">climb</button>
    <button data-clip="bells">bells</button>
    <button data-clip="ending">ending</button>
    <button data-clip="backwards(bells)">backwards(bells)</button>
    <button data-clip="call | call + 2">call | call + 2</button>
  </p>
  <p>playing: <span id="plays">call</span> <span id="waiting"></span></p>
  <ol id="log"></ol>
  <p class="hint"><a href="{{SITE}}round/" target="_blank">Full version with voices and drums</a></p>

  <script type="module" src="main.js"></script>
</body>
</html>
